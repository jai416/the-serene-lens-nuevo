    <ellipse cx="14" cy="-6" rx="12" ry="14" fill="#F8FAF5" opacity="0.9" transform="rotate(30,14,-6)"/>
    <ellipse cx="-10" cy="12" rx="12" ry="14" fill="#F8FAF5" opacity="0.9" transform="rotate(60,-10,12)"/>
    <ellipse cx="10" cy="12" rx="12" ry="14" fill="#F8FAF5" opacity="0.9" transform="rotate(-60,10,12)"/>
