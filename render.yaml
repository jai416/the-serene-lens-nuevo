services:
  - type: web
    name: the-serene-lens
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION; value: 22
      - key: DATABASE_URL; sync: false
      - key: NEXTAUTH_SECRET; sync: false
      - key: NEXTAUTH_URL; value: https://the-serene-lens-nuevo.onrender.com
      - key: NEXT_PUBLIC_APP_URL; value: https://the-serene-lens-nuevo.onrender.com
      - key: OPENROUTER_API_KEY; sync: false
      - key: QVAPAY_UUID; sync: false
      - key: QVAPAY_SECRET; sync: false
      - key: QVAPAY_API_URL; value: https://qvapay.com
      - key: RESEND_API_KEY; sync: false
      - key: CRON_SECRET; sync: false
      - key: ROOT_ADMIN_EMAIL; sync: false

  - type: worker
    name: the-serene-lens-bot
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r bot-telegram/requirements.txt
    startCommand: python bot-telegram/bot.py
    envVars:
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: ADMIN_TELEGRAM_IDS; sync: false
      - key: VALIDATOR_TELEGRAM_IDS; sync: false
      - key: DATABASE_URL; sync: false
      - key: SITE_URL; value: https://the-serene-lens-nuevo.onrender.com
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: monitor-pagos
    env: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/monitor_pagos.py
    envVars:
      - key: DATABASE_URL; sync: false
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: monitor-transfer
    env: python
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/monitor_transfer.py
    envVars:
      - key: DATABASE_URL; sync: false
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: check-apis
    env: python
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/check_apis.py
    envVars:
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: reporte-diario
    env: python
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/send_daily_report.py
    envVars:
      - key: DATABASE_URL; sync: false
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: reporte-semanal
    env: python
    plan: free
    schedule: "0 9 * * 1"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/send_weekly_report.py
    envVars:
      - key: DATABASE_URL; sync: false
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO

  - type: cron
    name: reporte-mensual
    env: python
    plan: free
    schedule: "0 9 1 * *"
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/send_monthly_report.py
    envVars:
      - key: DATABASE_URL; sync: false
      - key: TELEGRAM_TOKEN; sync: false
      - key: TELEGRAM_GROUP_ID; sync: false
      - key: LOG_LEVEL; value: INFO
